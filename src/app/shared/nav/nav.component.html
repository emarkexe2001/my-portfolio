<header class="sticky top-0 z-50 border-b border-periwinkle/40 bg-royal">
  <nav class="max-w-6xl mx-auto flex items-center justify-between px-6 py-4">
    <a routerLink="/" (click)="closeMenu()" class="inline-flex items-center gap-2 font-display text-xl font-bold tracking-tight text-cream">
      Emmanuel
      <span class="inline-grid grid-cols-2 gap-0.5">
        <span class="h-1.5 w-1.5 bg-coral"></span>
        <span class="h-1.5 w-1.5 bg-cream"></span>
        <span class="h-1.5 w-1.5 bg-cream"></span>
        <span class="h-1.5 w-1.5 bg-coral"></span>
      </span>
      Mark
    </a>

    <ul class="hidden sm:flex items-center gap-1 text-xs font-medium uppercase tracking-widest text-cream">
      <li>
        <a routerLink="/" routerLinkActive="bg-cream text-royal" [routerLinkActiveOptions]="{ exact: true }"
        class="block px-4 py-2 transition-colors hover:bg-periwinkle/30">Home</a>
      </li>
      <li>
        <a routerLink="/about" routerLinkActive="bg-cream text-royal"
        class="block px-4 py-2 transition-colors hover:bg-periwinkle/30">About</a>
      </li>
      <li class="ml-2">
        <a routerLink="/contact"
        class="block bg-coral px-5 py-2 font-bold text-ink transition-colors hover:bg-cream">Contact</a>
      </li>
    </ul>

    <button
      type="button"
      (click)="toggleMenu()"
      class="sm:hidden inline-flex items-center gap-2 text-xs font-medium uppercase tracking-widest text-cream"
      aria-label="Toggle menu"
      >
      Menu
      @if (!menuOpen) {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      }
      @if (menuOpen) {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      }
    </button>
  </nav>

  @if (menuOpen) {
    <ul class="sm:hidden flex flex-col border-t border-periwinkle/40 text-xs font-medium uppercase tracking-widest text-cream">
      <li>
        <a routerLink="/" (click)="closeMenu()" routerLinkActive="bg-cream text-royal" [routerLinkActiveOptions]="{ exact: true }"
        class="block px-6 py-3 border-b border-periwinkle/30 hover:bg-periwinkle/30">Home</a>
      </li>
      <li>
        <a routerLink="/about" (click)="closeMenu()" routerLinkActive="bg-cream text-royal"
        class="block px-6 py-3 border-b border-periwinkle/30 hover:bg-periwinkle/30">About</a>
      </li>
      <li>
        <a routerLink="/contact" (click)="closeMenu()"
        class="block bg-coral px-6 py-3 font-bold text-ink">Contact</a>
      </li>
    </ul>
  }
</header>

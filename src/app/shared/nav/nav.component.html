<header class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur border-b border-slate-800">
  <nav class="max-w-5xl mx-auto flex items-center justify-between px-6 py-4">
    <a routerLink="/" (click)="closeMenu()" class="text-lg font-semibold tracking-tight text-white transition-transform duration-300 hover:scale-105 inline-block">
      Emmanuel Mark
    </a>

    <ul class="hidden sm:flex items-center gap-8 text-sm font-medium text-slate-300">
      <li>
        <a routerLink="/" routerLinkActive="text-sky-400 after:w-full" [routerLinkActiveOptions]="{ exact: true }"
           class="relative py-1 hover:text-white transition-colors after:absolute after:-bottom-0.5 after:left-0 after:h-[2px] after:w-0 after:bg-sky-400 after:transition-all after:duration-300 hover:after:w-full">Home</a>
      </li>
      <li>
        <a routerLink="/about" routerLinkActive="text-sky-400 after:w-full"
           class="relative py-1 hover:text-white transition-colors after:absolute after:-bottom-0.5 after:left-0 after:h-[2px] after:w-0 after:bg-sky-400 after:transition-all after:duration-300 hover:after:w-full">About</a>
      </li>
      <li>
        <a routerLink="/contact"
           class="inline-flex items-center rounded-full bg-white px-5 py-1.5 font-semibold text-slate-950 shadow-md shadow-white/10 transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-white/30 hover:bg-slate-100 active:translate-y-0">Contact</a>
      </li>
    </ul>

    <button
      type="button"
      (click)="toggleMenu()"
      class="sm:hidden text-slate-300 hover:text-white transition-transform duration-300 active:scale-90"
      aria-label="Toggle menu"
    >
      <svg *ngIf="!menuOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <svg *ngIf="menuOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </nav>

  <ul *ngIf="menuOpen" class="sm:hidden flex flex-col gap-1 px-6 pb-4 text-sm font-medium text-slate-300 animate-fade-in-up">
    <li>
      <a routerLink="/" (click)="closeMenu()" routerLinkActive="text-sky-400" [routerLinkActiveOptions]="{ exact: true }"
         class="block py-2 hover:text-white hover:translate-x-1 transition-all">Home</a>
    </li>
    <li>
      <a routerLink="/about" (click)="closeMenu()" routerLinkActive="text-sky-400"
         class="block py-2 hover:text-white hover:translate-x-1 transition-all">About</a>
    </li>
    <li class="pt-2">
      <a routerLink="/contact" (click)="closeMenu()"
         class="inline-flex items-center rounded-full bg-white px-5 py-1.5 font-semibold text-slate-950 shadow-md shadow-white/10 transition-all duration-300 hover:shadow-lg hover:shadow-white/30 hover:bg-slate-100 active:scale-95">Contact</a>
    </li>
  </ul>
</header>

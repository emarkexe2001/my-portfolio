<section class="border-b border-periwinkle/40 bg-ink">
  <div class="max-w-6xl mx-auto border-x border-periwinkle/40">
    <div class="border-b border-periwinkle/40 px-6 py-2 text-[10px] uppercase tracking-widest text-periwinkle">
      2://contact
    </div>

    <div class="px-6 py-16 sm:py-20">
      <h1 class="font-display text-4xl font-bold uppercase tracking-tight text-cream animate-fade-in-up sm:text-6xl">
        Get In <span class="text-[#fd5a4a]">Touch</span>
      </h1>
      <p class="mt-4 max-w-xl text-sm leading-relaxed text-cream/70 animate-fade-in-up [animation-delay:100ms]">
        Feel free to reach out through any of the channels below &mdash; I'm happy
        to hear from you.
      </p>
    </div>

    <div class="border-t border-periwinkle/40">
      @for (channel of channels; track channel.label; let i = $index) {
        <a
          [href]="channel.href"
          [target]="channel.external ? '_blank' : null"
          [rel]="channel.external ? 'noopener' : null"
          class="group flex items-center justify-between gap-4 border-b border-periwinkle/40 px-6 py-8 transition-colors hover:bg-royal animate-fade-in-up"
          [style.animation-delay.ms]="200 + i * 100"
        >
          <div class="flex items-center gap-4 sm:gap-8">
            <span class="flex h-10 w-10 flex-none items-center justify-center border border-periwinkle/40">
              <img [src]="channel.icon" [alt]="channel.label" class="h-5 w-5 object-contain" loading="lazy" />
            </span>
            <div>
              <div class="font-display text-xl font-bold uppercase tracking-tight text-cream sm:text-3xl">
                {{ channel.label }}
              </div>
              <div class="mt-1 text-xs text-cream/60 break-all">{{ channel.value }}</div>
            </div>
          </div>
          <span class="flex h-10 w-10 flex-none items-center justify-center bg-coral text-lg text-ink transition-transform duration-300 group-hover:translate-x-1">
            &rarr;
          </span>
        </a>
      }
    </div>
  </div>

  <app-pixel-bars theme="onDark" class="block h-20 border-t border-periwinkle/40 px-1 py-1 opacity-70 sm:h-28"></app-pixel-bars>
</section>
